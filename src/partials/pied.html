<footer>
  <div class="wrap">
    <div class="sig">{{signature}}</div>
    <div class="liens"><span>[[footer.distributrice|Distributrice indépendante Farmasi]]</span><span class="sep">·</span><a href="{{lien_legal}}">[[footer.legal|Mentions légales]]</a><span class="sep">·</span><span>© 2026 {{nom}}</span></div>
  </div>
</footer>

<script>
  /* Site en une seule page HTML par langue : navigation sans rechargement.
     Adresses : #histoire, #packs, #packs-nutrition (une catégorie), #pack-routine (un pack précis). */
  (function () {
    var pages = document.querySelectorAll('.page');
    var liens = document.querySelectorAll('.menu nav > a, .menu .lien-packs');
    var onglets = document.querySelectorAll('.onglet');
    var groupes = document.querySelectorAll('.groupe');
    var noms = {};
    pages.forEach(function (p) { noms[p.dataset.page] = true; });

    /* Catégories de packs */
    function categorie(cat) {
      onglets.forEach(function (b) {
        var ok = b.dataset.cat === cat;
        b.classList.toggle('actif', ok);
        b.setAttribute('aria-selected', ok ? 'true' : 'false');
      });
      groupes.forEach(function (g) { g.hidden = g.dataset.cat !== cat; });
    }
    onglets.forEach(function (b) { b.addEventListener('click', function () { categorie(b.dataset.cat); }); });
    categorie('nutrition');

    /* Menu du téléphone */
    var menu = document.querySelector('.menu');
    var burger = document.querySelector('.burger');
    function menuOuvert(ouvert) {
      if (ouvert) document.getElementById('menu-principal').style.top = Math.max(0, menu.getBoundingClientRect().bottom) + 'px';
      menu.classList.toggle('ouvert', ouvert);
      document.body.classList.toggle('menu-ouvert', ouvert);
      burger.setAttribute('aria-expanded', ouvert ? 'true' : 'false');
      burger.setAttribute('aria-label', ouvert ? burger.dataset.fermer : burger.dataset.ouvrir);
    }
    burger.addEventListener('click', function () { menuOuvert(!menu.classList.contains('ouvert')); });
    document.querySelectorAll('.menu nav a').forEach(function (a) { a.addEventListener('click', function () { menuOuvert(false); }); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') menuOuvert(false); });
    window.matchMedia('(min-width: 1101px)').addEventListener('change', function (m) { if (m.matches) menuOuvert(false); });

    /* Changer de langue en restant sur la même page */
    document.querySelectorAll('.langues a').forEach(function (a) {
      a.addEventListener('click', function () { a.href = a.href.split('#')[0] + location.hash; });
    });

    /* Apparition douce des blocs au défilement */
    var blocs = document.querySelectorAll('.reveal');
    if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('anim');
      var obs = new IntersectionObserver(function (entrees) {
        entrees.forEach(function (e) {
          if (e.isIntersecting) {
            var b = e.target; b.classList.add('vu'); obs.unobserve(b);
            setTimeout(function () { b.style.transitionDelay = ''; }, 1000);
          }
        });
      }, { rootMargin: '0px 0px -8% 0px' });
      blocs.forEach(function (b, i) { b.style.transitionDelay = (i % 4) * 80 + 'ms'; obs.observe(b); });
    }

    /* Affichage d'une page */
    /* Formulaire du bilan : prépare un message à envoyer sur WhatsApp ou à copier */
    var form = document.querySelector('.form-bilan');
    if (form) {
      var apercu = form.querySelector('.apercu'), zone = form.querySelector('.apercu-texte'), etat = form.querySelector('.etat');
      var wa = form.querySelector('.whatsapp'), numero = (form.dataset.whatsapp || '').replace(/[^0-9]/g, '');
      form.querySelectorAll('[data-montre]').forEach(function (c) {
        c.addEventListener('change', function () { form.querySelector('[data-champ="' + c.dataset.montre + '"]').hidden = !c.checked; });
      });
      function libelle(el) { if (el.dataset && el.dataset.msg) return el.dataset.msg; return el.closest('label').querySelector('span').textContent.replace(/\s*\*$/, '').trim(); }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!form.prenom.value.trim() || !form.nom.value.trim()) { etat.textContent = form.dataset.erreur; apercu.hidden = false; zone.value = ''; form.prenom.focus(); return; }
        var lignes = [form.querySelector('input[value=sport]').checked ? form.dataset.bonjourBilan : form.dataset.bonjour, ''];
        ['prenom', 'nom', 'age', 'sexe'].forEach(function (n) { var v = form[n].value.trim(); if (v && !(n === 'sexe' && form[n].selectedIndex === 0)) lignes.push(libelle(form[n]) + ' : ' + v); });
        form.querySelectorAll('.pilules').forEach(function (g) {
          var choix = [].slice.call(g.querySelectorAll('input:checked')).map(function (c) { return c.nextElementSibling.textContent.trim(); });
          if (choix.length) lignes.push(g.dataset.msg + ' : ' + choix.join(', '));
        });
        if (form.message.value.trim()) lignes.push('', form.message.value.trim());
        var texte = lignes.join('\n');
        zone.value = texte;
        wa.href = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(texte);
        wa.hidden = !numero;
        etat.textContent = form.dataset.oui;
        apercu.hidden = false;
        apercu.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
      function majLien() { wa.href = 'https://wa.me/' + numero + '?text=' + encodeURIComponent(zone.value); }
      zone.addEventListener('input', majLien);
      wa.addEventListener('click', majLien);
      form.querySelector('.copier').addEventListener('click', function () {
        function ok() { etat.textContent = form.dataset.copie; }
        try { navigator.clipboard.writeText(zone.value).then(ok, function () { zone.select(); document.execCommand('copy'); ok(); }); }
        catch (err) { zone.select(); try { document.execCommand('copy'); ok(); } catch (e2) {} }
      });
    }

    /* Un bouton peut pré-cocher un sujet du formulaire (data-sujet) */
    var sujetDemande = null;
    document.querySelectorAll('[data-sujet]').forEach(function (a) {
      a.addEventListener('click', function () { sujetDemande = a.dataset.sujet; });
    });
    function preCocher() {
      if (!form || !sujetDemande) return;
      var c = form.querySelector('input[name=amene][value="' + sujetDemande + '"]');
      if (c && !c.checked) { c.checked = true; c.dispatchEvent(new Event('change')); }
      sujetDemande = null;
    }

    /* FAQ : une seule question ouverte à la fois */
    document.querySelectorAll('[data-une-seule]').forEach(function (bloc) {
      bloc.querySelectorAll('details').forEach(function (d) {
        d.addEventListener('toggle', function () {
          if (d.open) bloc.querySelectorAll('details[open]').forEach(function (autre) { if (autre !== d) autre.open = false; });
        });
      });
    });

    /* Bouton Retour : revient à la page précédente du site, sinon à la page parente */
    var boutonRetour = document.querySelector('.btn-retour');
    var parcours = [], premier = true, positions = {}, remplace = false;
    var typeNav = '';
    try { typeNav = performance.getEntriesByType('navigation')[0].type; } catch (e) {}
    try { positions = JSON.parse(sessionStorage.getItem('positions') || '{}'); } catch (e) {}
    function noterPosition() {
      positions[location.hash || '#accueil'] = window.scrollY;
      try { sessionStorage.setItem('positions', JSON.stringify(positions)); } catch (e) {}
    }
    window.addEventListener('scroll', noterPosition, { passive: true });
    window.addEventListener('pagehide', noterPosition);
    boutonRetour.addEventListener('click', function (e) {
      e.preventDefault();
      if (parcours.length >= 2) { history.back(); return; }
      var nom = location.hash.replace('#', '');
      remplace = true;
      location.replace('#' + (nom.indexOf('offres-') === 0 ? 'offres' : (nom.indexOf('pack') === 0 && nom !== 'packs' ? 'packs' : 'accueil')));
    });

    function afficher() {
      var nom = location.hash.replace('#', '');
      var cat = null, carte = null;
      if (nom.indexOf('packs-') === 0) { cat = nom.slice(6); nom = 'packs'; }
      else if (nom.indexOf('pack-') === 0) {
        carte = document.querySelector('.carte[data-pack="' + nom.slice(5) + '"]');
        if (carte) cat = carte.closest('.groupe').dataset.cat;
        nom = 'packs';
      }
      if (!noms[nom]) nom = 'accueil';
      var titre = '';
      pages.forEach(function (p) {
        var ok = p.dataset.page === nom;
        p.hidden = !ok;
        p.classList.toggle('entree', ok);
        if (ok && p.dataset.titre) titre = p.dataset.titre;
      });
      document.body.dataset.page = nom;
      var rubrique = nom.indexOf('offres-') === 0 ? 'offres' : nom;
      liens.forEach(function (a) { a.classList.toggle('actif', a.getAttribute('href') === '#' + rubrique); });
      if (titre) document.title = titre;
      if (cat) categorie(cat);
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      /* Parcours : si on revient sur la page précédente, on retrouve l'endroit où on était */
      var cle = location.hash || '#accueil', retour = false;
      if (remplace) { parcours = [cle]; remplace = false; }
      else if (parcours.length >= 2 && parcours[parcours.length - 2] === cle) { parcours.pop(); retour = true; }
      else if (parcours[parcours.length - 1] !== cle) parcours.push(cle);
      if (premier && typeNav === 'back_forward') retour = true;
      premier = false;
      var y = retour ? (positions[cle] || 0) : 0;
      window.scrollTo({ top: y, behavior: 'instant' });
      if (retour && y) setTimeout(function () { window.scrollTo({ top: y, behavior: 'instant' }); }, 60);
      boutonRetour.hidden = (nom === 'accueil');
      if (nom === 'bilan') preCocher();
      if (carte) {
        setTimeout(function () {
          carte.scrollIntoView({ behavior: 'smooth', block: 'center' });
          carte.classList.remove('vise'); void carte.offsetWidth; carte.classList.add('vise');
        }, 250);
      }
    }
    /* Le bouton fixe n'apparaît qu'une fois le haut de page dépassé */
    function defile() { document.body.classList.toggle('defile', window.scrollY > 420); }
    window.addEventListener('scroll', defile, { passive: true });

    /* Offres : chaque élément avec data-fin (et éventuellement data-debut) ne s'affiche que pendant sa période */
    var aujourdhui = new Date().toISOString().slice(0, 10);
    document.querySelectorAll('[data-fin]').forEach(function (el) {
      var active = el.dataset.fin >= aujourdhui && (!el.dataset.debut || el.dataset.debut <= aujourdhui);
      el.hidden = !active;
    });
    var vide = document.querySelector('.offres-vide');
    if (vide) vide.hidden = !!document.querySelector('.choix-offre:not([hidden])');
    document.querySelectorAll('.offre-page').forEach(function (pg) {
      var bloc = pg.querySelector('.offre-bloc'), fin = pg.querySelector('.offre-terminee');
      if (bloc && fin) fin.hidden = !bloc.hidden;
    });

    window.addEventListener('hashchange', function () { afficher(); defile(); });
    afficher();
    defile();
  })();
</script>
</body>
</html>
